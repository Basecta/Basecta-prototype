version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: biodiversity_postgres
    environment:
      POSTGRES_USER: biodiversity_user
      POSTGRES_PASSWORD: biodiversity_password
      POSTGRES_DB: biodiversity_db
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: